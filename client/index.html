<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E1311" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Melachaite Travel — Private Lake Kariba Journeys, Zimbabwe</title>
    <meta
      name="description"
      content="Private safaris, luxury cruises and tiger fishing expeditions on Lake Kariba. Tailor-made journeys across the wild heart of Zimbabwe, hosted by Kariba-born guides."
    />
    <link rel="canonical" href="https://melachaitetravel.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Melachaite Travel" />
    <meta property="og:title" content="Melachaite Travel — The Zambezi, at its most extraordinary" />
    <meta
      property="og:description"
      content="Private safaris, luxury cruises and unforgettable adventures across Lake Kariba, Zimbabwe."
    />
    <meta property="og:url" content="https://melachaitetravel.com/" />
    <meta property="og:locale" content="en_GB" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1598338332181-c7a78afa1198?auto=format&fit=crop&w=1200&h=630&q=80"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Golden hour on the Zambezi, riverbank trees in silhouette against an amber sky."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Melachaite Travel — Private Lake Kariba journeys" />
    <meta
      name="twitter:description"
      content="Private safaris, luxury cruises and unforgettable adventures across Lake Kariba, Zimbabwe."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1598338332181-c7a78afa1198?auto=format&fit=crop&w=1200&h=630&q=80"
    />

    <!-- Fonts. Cormorant Garamond carries the display voice; Jost is the quiet
         body and UI face. Preconnect so the hero type is not held up. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
    />
    <!-- Warm up the image CDN before React mounts and requests the hero. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Melachaite Travel",
        "description": "Private luxury journeys on Lake Kariba and the Zambezi — safaris, cruises, tiger fishing and bespoke charters.",
        "url": "https://melachaitetravel.com/",
        "email": "hello@melachaitetravel.com",
        "telephone": "+263612954118",
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Lakeview Road, Kariba Heights",
          "addressLocality": "Kariba",
          "addressRegion": "Mashonaland West",
          "addressCountry": "ZW"
        },
        "areaServed": { "@type": "Place", "name": "Lake Kariba, Zimbabwe" },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "bestRating": "5",
          "ratingCount": "184"
        },
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "The Signature Kariba Escape",
            "description": "A private three-day journey across Lake Kariba combining secluded bays, spectacular sunsets, wildlife encounters and exceptional hospitality.",
            "touristType": ["Luxury travellers", "Couples", "Families", "Private groups"]
          },
          "price": "2850",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
